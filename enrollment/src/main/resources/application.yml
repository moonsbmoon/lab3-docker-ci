server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: enrollment
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # --- НАСТРОЙКИ БАЗЫ ДАННЫХ ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/edu_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing" # <--- ДОБАВЛЕНО ЭТО
  # -------------------------------------

  # --- НАСТРОЙКИ ДЛЯ RABBITMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  # -------------------------------------

catalog:
  base-url: ${CATALOG_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"