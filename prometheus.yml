global:
  scrape_interval: 5s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'catalog'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['catalog:8081']

  - job_name: 'enrollment'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['enrollment:8082']

  - job_name: 'edu-platform'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['edu-platform:8080']