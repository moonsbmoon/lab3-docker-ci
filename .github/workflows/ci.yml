name: Build and Publish

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install pricing-lib
        # Устанавливаем локальную библиотеку, чтобы billing мог её найти
        run: mvn -f pricing-lib/pom.xml clean install -DskipTests

      - name: Set Version for billing
        # Указываем путь к pom.xml модуля billing
        run: mvn -f billing/pom.xml versions:set -DnewVersion=1.0.${{ github.run_number }} -DgenerateBackupPoms=false

      - name: Build and Test billing
        # Собираем и тестируем именно billing (здесь ваша логика варианта 3)
        run: mvn -f billing/pom.xml clean package

      - name: Generate Manifest
        run: |
          echo "Version: 1.0.${{ github.run_number }}" > manifest.txt
          echo "Commit: ${{ github.sha }}" >> manifest.txt
          echo "Run: ${{ github.run_number }}" >> manifest.txt
          echo "Java: 21" >> manifest.txt
          echo "Spring Boot: 3.3.5" >> manifest.txt
          echo "Supported API: 1.0, 2.0" >> manifest.txt
          echo "DB Schema: v2" >> manifest.txt
          sha256sum billing/target/billing-1.0.${{ github.run_number }}.jar >> manifest.txt

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            billing/target/billing-1.0.${{ github.run_number }}.jar
            manifest.txt