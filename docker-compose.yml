services:
  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin
    user: "0:0"
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus
    user: "0:0"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml

  catalog:
    build:
      context: .
      dockerfile: ./catalog/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - CATALOG_DELAY_MS=0
      - RABBITMQ_HOST=rabbitmq # <--- ИСПРАВЛЕНО (добавлена буква R)
    depends_on:
      - rabbitmq

  enrollment:
    build:
      context: .
      dockerfile: ./enrollment/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - CATALOG_URL=http://catalog:8081
      - RABBITMQ_HOST=rabbitmq # <-- ДОБАВЛЕНО: адрес RabbitMQ в сети Docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - catalog
      - rabbitmq # <-- ДОБАВЛЕНО: ждем запуска RabbitMQ
      - postgres

  billing:
    build:
      context: .
      dockerfile: ./billing/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/billing_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
      - postgres

  payment:
    build:
      context: .
      dockerfile: ./payment/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
      - postgres

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      - enrollment
      - catalog

  edu-platform:
    build:
      context: .
      dockerfile: ./edu-platform/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edu_platform
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    platform: linux/amd64
    ports:
      - "5672:5672"   # Порт для подключения приложений
      - "15672:15672" # Веб-интерфейс для управления
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: